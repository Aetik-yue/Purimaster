[package]
name = "purimaster"
version = "0.1.0"
edition = "2024"
description = "Purimaster 净化大师 - Windows 磁盘清理工具"

# Tauri 2 模板要求的库形态
[lib]
name = "purimaster_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
purimaster-core = { path = "../crates/core" }
purimaster-rules = { path = "../crates/rules" }
purimaster-platform = { path = "../crates/platform" }
