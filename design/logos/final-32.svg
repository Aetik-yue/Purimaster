<?xml version="1.0" encoding="UTF-8"?>
<!-- Purimaster ≤32px 简化变体：全部直线坐标对齐 32 单位栅格（16px 下 32u=1px、32px 下 =2px，竖笔与两处径向平切零抗锯齿）。扫尾截为径向平切：精确 ~60° 斜切在 32 栅格上无整点解（cos60°=1/2 有理而 sin60°=√3/2 无理；3-4-5、5-12-13 毕氏射线经模 32 同余验证均无 90–110 内合规外径），故取 0°/90° 轴对齐径向平切、扇形全开 90°。字腔（内圆 r=32，正切竖笔右缘）顺右下开口流入被扫空通道。主色 #14655a。圆弧沿线存在固有抗锯齿过渡（圆形无法栅格对齐），实测值见校验报告。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="32" height="32" role="img" aria-label="Purimaster small mark P, simplified for 16-32 px">
  <g fill="#14655a">
    <rect x="160" y="96" width="64" height="320"/>
    <path d="M 352 224 A 96 96 0 1 0 256 320 L 256 256 A 32 32 0 1 1 288 224 Z"/>
  </g>
</svg>
