[package]
name = "purimaster-rules"
version = "0.1.0"
edition = "2024"
description = "Purimaster 清理规则引擎：TOML 规则加载、校验、环境变量展开、glob 匹配与垃圾扫描"

[dependencies]
purimaster-platform = { path = "../platform" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
globset = "0.4"

[dev-dependencies]
tempfile = "3"
