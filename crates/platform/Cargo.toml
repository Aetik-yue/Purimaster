[package]
name = "purimaster-platform"
version = "0.1.0"
edition = "2024"
description = "Purimaster 平台特化逻辑：系统关键路径保护（硬编码，不随规则数据变化）"

[dependencies]
trash = "5"
dirs = "6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_System_WindowsProgramming",
] }

[dev-dependencies]
tempfile = "3"
